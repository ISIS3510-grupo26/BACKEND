<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CampusBites Dashboard</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
  /* Dashboard del equipo: una tarjeta por business question. Lee los endpoints /api/v1/analytics de este backend. */
  :root {
    --tomato: #DD5E45;
    --espresso: #3A2A22;
    --cream: #FFF8F0;
    --mint: #4CAF7D;
    --card: #FFFFFF;
    --muted: #8A7A70;
    --border: #F0E2D6;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--cream);
    color: var(--espresso);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  header {
    display: flex;
    flex-wrap: wrap;
    gap: 12px;
    align-items: center;
    justify-content: space-between;
    padding: 20px 24px 8px;
  }
  h1 { margin: 0; font-size: 26px; letter-spacing: -0.5px; }
  h1 span { color: var(--tomato); }
  .toolbar { display: flex; gap: 12px; align-items: center; color: var(--muted); font-size: 13px; }
  button {
    background: var(--tomato);
    color: #fff;
    border: 0;
    border-radius: 999px;
    padding: 10px 18px;
    font-weight: 700;
    cursor: pointer;
  }
  button:disabled { opacity: 0.6; cursor: wait; }
  main {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
    gap: 16px;
    padding: 16px 24px 32px;
  }
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 18px;
    padding: 18px;
    display: flex;
    flex-direction: column;
    gap: 10px;
    min-width: 0;
  }
  .card.wide { grid-column: span 2; }
  @media (max-width: 760px) { .card.wide { grid-column: auto; } main { padding: 16px; } }
  .meta { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  .badge {
    background: var(--espresso);
    color: #fff;
    border-radius: 999px;
    padding: 4px 10px;
    font-size: 12px;
    font-weight: 800;
  }
  .card.mine .badge { background: var(--tomato); }
  .author { font-size: 12px; color: var(--muted); }
  .question { margin: 0; font-size: 14px; line-height: 1.4; font-weight: 600; }
  .key { font-size: 36px; font-weight: 900; letter-spacing: -1px; line-height: 1; }
  .key-label { font-size: 12px; color: var(--muted); }
  .chart { position: relative; height: 200px; }
  .error { color: var(--tomato); font-size: 13px; }
  .recommendation { font-size: 44px; font-weight: 900; letter-spacing: -1px; line-height: 1; }
  .recommendation.improve { color: var(--tomato); }
  .recommendation.keep { color: var(--mint); }
  .months { display: flex; flex-wrap: wrap; gap: 6px; }
  .month {
    background: var(--cream);
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 4px 10px;
    font-size: 12px;
  }
  .month b { font-weight: 800; }
</style>
</head>
<body>
<header>
  <h1>Campus<span>Bites</span> · Business Questions</h1>
  <div class="toolbar">
    <span id="updated">Loading…</span>
    <button id="refresh" type="button">Refresh</button>
  </div>
</header>
<main id="cards"></main>

<script>
  const COLORS = { tomato: '#DD5E45', espresso: '#3A2A22', mint: '#4CAF7D', muted: '#8A7A70' };
  const REFRESH_MS = 30000;

  const last = list => list[list.length - 1];
  const pct = n => `${n}%`;

  // Cada tarjeta: endpoint (con sus parametros por defecto) y como mostrar su respuesta.
  // render() devuelve el numero clave, su descripcion y un grafico simple {type, labels, values, label}.
  const CARDS = [
    {
      bq: 'BQ1', author: 'Tomas Diaz', endpoint: '/api/v1/analytics/slow-page-loads?thresholdMs=3000',
      render: r => ({
        key: pct(r.slowPercentage),
        label: `of ${r.totalLoads} restaurant page loads took more than ${r.thresholdMs / 1000} s`,
        chart: { type: 'bar', label: '% slow loads', labels: r.byDevice.map(g => g.key), values: r.byDevice.map(g => g.slowPercentage) },
      }),
    },
    {
      bq: 'BQ2', author: 'Tomas Diaz', endpoint: '/api/v1/analytics/failed-requests',
      render: r => ({
        key: pct(r.failurePercentage),
        label: `${r.failedRequests} of ${r.totalRequests} restaurant requests failed`,
        chart: { type: 'bar', label: 'Failed requests', labels: r.byErrorType.map(g => g.key), values: r.byErrorType.map(g => g.failedRequests) },
      }),
    },
    {
      bq: 'BQ6', author: 'Lucas Galindo', endpoint: '/api/v1/recommendations/best-for-you?freshMinutes=120&limit=5',
      render: r => {
        const top = r.spots[0];
        const wait = s => (s.isRecent && s.waitMinutes !== null ? s.waitMinutes : 0);
        return {
          key: top ? `${top.emoji} ${top.name}` : '—',
          label: top && top.isRecent ? `shortest reported wait right now: ${top.waitMinutes} min` : 'no recent wait reports yet',
          chart: { type: 'bar', label: 'Reported wait (min)', labels: r.spots.map(s => s.name), values: r.spots.map(wait) },
        };
      },
    },
    {
      bq: 'BQ7', author: 'Camilo Linares', endpoint: '/api/v1/analytics/monthly-active-favoriters?months=12',
      render: r => ({
        key: last(r.byMonth).activeFavoriters,
        label: `active users added favorites in ${last(r.byMonth).month}`,
        chart: { type: 'line', label: 'Active favoriters', labels: r.byMonth.map(m => m.month), values: r.byMonth.map(m => m.activeFavoriters) },
      }),
    },
    {
      bq: 'BQ10', author: 'Gabriela Perdomo', endpoint: '/api/v1/analytics/rating-usage?months=6',
      render: r => ({
        key: pct(last(r.byMonth).ratingUsagePercentage),
        label: `${last(r.byMonth).raters} of ${last(r.byMonth).viewers} viewers rated a restaurant in ${last(r.byMonth).month}`,
        chart: { type: 'bar', label: '% of viewers who rated', labels: r.byMonth.map(m => m.month), values: r.byMonth.map(m => m.ratingUsagePercentage) },
      }),
    },
    {
      // Todavia no hay endpoint de la BQ11 en app/routers/analytics.py: cuando exista, poner aqui su endpoint y render.
      bq: 'BQ11', author: 'Lucas Galindo', endpoint: null,
      question: 'Question pending: the BQ11 endpoint is not in the backend yet.',
    },
    {
      bq: 'BQ12', author: 'Alejandro Vides', endpoint: '/api/v1/analytics/searches-by-weekday?days=28',
      render: r => {
        const top = r.byDay.reduce((a, b) => (b.searches > a.searches ? b : a));
        return {
          key: r.totalSearches ? top.dayName : '—',
          label: `${top.searches} of ${r.totalSearches} searches in the last ${r.days} days`,
          chart: { type: 'bar', label: 'Searches', labels: r.byDay.map(d => d.dayName.slice(0, 3)), values: r.byDay.map(d => d.searches) },
        };
      },
    },
    {
      bq: 'BQ14', author: 'Esteban Alvarado', endpoint: '/api/v1/analytics/map-display-issues?months=3&maxIssuePercentage=10',
      mine: true, wide: true,
      render: r => ({
        recommendation: r.recommendation,
        key: pct(r.issuePercentage),
        label: `issues in ${r.mapLoads} map loads (limit ${r.maxIssuePercentage}%)` +
          (r.mainIssue ? ` · main issue: ${r.mainIssue}` : ''),
        months: r.byMonth.map(m => ({ month: m.month, value: pct(m.issuePercentage) })),
        chart: { type: 'bar', label: 'Issues', labels: Object.keys(r.issuesByType), values: Object.values(r.issuesByType) },
      }),
    },
  ];

  const charts = {};
  const el = (tag, className, text) => {
    const node = document.createElement(tag);
    if (className) node.className = className;
    if (text !== undefined) node.textContent = text;
    return node;
  };

  function buildCards() {
    const root = document.getElementById('cards');
    for (const card of CARDS) {
      const node = el('section', 'card' + (card.mine ? ' mine' : '') + (card.wide ? ' wide' : ''));
      const meta = el('div', 'meta');
      meta.append(el('span', 'badge', card.bq), el('span', 'author', card.author));
      card.questionNode = el('p', 'question', card.question || '');
      card.bodyNode = el('div');
      node.append(meta, card.questionNode, card.bodyNode);
      root.append(node);
    }
  }

  function drawChart(card, canvas, chart) {
    charts[card.bq]?.destroy();
    const color = card.mine ? COLORS.tomato : COLORS.espresso;
    charts[card.bq] = new Chart(canvas, {
      type: chart.type,
      data: {
        labels: chart.labels,
        datasets: [{
          label: chart.label, data: chart.values,
          backgroundColor: chart.type === 'line' ? 'rgba(76, 175, 125, 0.15)' : color,
          borderColor: chart.type === 'line' ? COLORS.mint : color,
          borderRadius: 6, fill: chart.type === 'line', tension: 0.3,
        }],
      },
      options: {
        responsive: true, maintainAspectRatio: false, animation: false,
        plugins: { legend: { display: false } },
        scales: { y: { beginAtZero: true, ticks: { precision: 0, color: COLORS.muted } }, x: { ticks: { color: COLORS.muted } } },
      },
    });
  }

  async function loadCard(card) {
    const body = card.bodyNode;
    if (!card.endpoint) {
      body.replaceChildren(el('p', 'error', 'Endpoint not available yet.'));
      return;
    }
    try {
      const response = await fetch(card.endpoint, { cache: 'no-store' });
      if (!response.ok) throw new Error(`HTTP ${response.status}`);
      const report = await response.json();
      const view = card.render(report);
      card.questionNode.textContent = report.question;

      const nodes = [];
      if (view.recommendation) {
        nodes.push(el('div', `recommendation ${view.recommendation}`, view.recommendation.toUpperCase()));
        nodes.push(el('div', 'key-label', view.recommendation === 'improve'
          ? 'The map shows too many wrong or missing locations: improve or change it.'
          : 'The map works well enough: keep it.'));
      }
      nodes.push(el('div', 'key', String(view.key)), el('div', 'key-label', view.label));
      if (view.months) {
        const months = el('div', 'months');
        for (const m of view.months) {
          const chip = el('span', 'month', `${m.month}: `);
          chip.append(el('b', null, m.value));
          months.append(chip);
        }
        nodes.push(months);
      }
      const box = el('div', 'chart');
      const canvas = el('canvas');
      box.append(canvas);
      nodes.push(box);
      body.replaceChildren(...nodes);
      drawChart(card, canvas, view.chart);
    } catch (e) {
      charts[card.bq]?.destroy();
      delete charts[card.bq];
      body.replaceChildren(el('p', 'error', `Couldn't load ${card.bq}: ${e.message}`));
    }
  }

  async function refreshAll() {
    const button = document.getElementById('refresh');
    button.disabled = true;
    await Promise.all(CARDS.map(loadCard));
    button.disabled = false;
    document.getElementById('updated').textContent = `Updated ${new Date().toLocaleTimeString()} · auto refresh every 30 s`;
  }

  buildCards();
  document.getElementById('refresh').addEventListener('click', refreshAll);
  refreshAll();
  setInterval(refreshAll, REFRESH_MS);
</script>
</body>
</html>
